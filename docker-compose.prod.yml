  #   depends_on:
  #     - frontend
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: playability-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/scripts/docker-entrypoint-initdb.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-playability_user} -d ${DB_NAME:-playability}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - playability-network

  # Backend API (Go)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: playability-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - playability-network

  # Frontend (Nuxt 3) - Production
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: playability-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NUXT_API_URL=${NUXT_API_URL}
      - NUXT_PUBLIC_API_URL=${NUXT_PUBLIC_API_URL}
    ports:
      - "80:3000"
    depends_on:
      - backend
    networks:
      - playability-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    profiles:
      - production



networks:
  playability-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
