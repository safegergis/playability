services:
  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80" # Map port 80 of the host to port 80 of the Nginx container_nam
      - "443:443" # Uncomment and configure for HTTPS
    volumes:
      - ./nginx/certbot_temp.conf:/etc/nginx/conf.d/default.conf
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
    depends_on:
      - frontend
    networks:
      - playability-network
  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./certbot/certbot_init.sh:/usr/local/bin/certbot_init.sh
    entrypoint: "/usr/local/bin/certbot_init.sh"
    depends_on:
      - nginx
    command: certonly --webroot -w /var/www/certbot --force-renewal -d playablty.com -d www.playablty.com --email safegerg@gmail.com --rsa-key-size 4096 --agree-tos --non-interactive
    networks:
      - playability-network 
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: playability-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/scripts/docker-entrypoint-initdb.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-playability_user} -d ${DB_NAME:-playability}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - playability-network

  # Backend API (Go)
  backend:
    image: ${DOCKERHUB_USERNAME}/playability-backend:latest
    container_name: playability-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - playability-network

  # Frontend (Nuxt 3) - Production
  frontend:
    image: ${DOCKERHUB_USERNAME}/playability-frontend:latest
    container_name: playability-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NUXT_API_URL=${NUXT_API_URL}
      - NUXT_PUBLIC_API_URL=${NUXT_PUBLIC_API_URL}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - playability-network



networks:
  playability-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  certbot-etc:
  certbot-var:
