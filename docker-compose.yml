services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: playability-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/scripts/docker-entrypoint-initdb.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-playability_user} -d ${DB_NAME:-playability}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - playability-network

  # Backend API (Go)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: playability-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - playability-network

  # Frontend (Nuxt 3) - Production
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: playability-frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - playability-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    profiles:
      - production

  # Frontend (Nuxt 3) - Development with Hot Reload
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: playability-frontend-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "24678:24678"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.nuxt
    tmpfs:
      - /tmp
    environment:
      - BACKEND_API_URL=${BACKEND_API_URL}
    depends_on:
      - backend
    networks:
      - playability-network
    profiles:
      - dev

  # Database Backup Service (runs on schedule)
  db-backup:
    image: postgres:16-alpine
    container_name: playability-db-backup
    restart: "no"
    env_file:
      - .env
    environment:
      BACKUP_DIR: /backups
      RETENTION_DAYS: 30
    volumes:
      - ./database/scripts/backup.sh:/backup.sh:ro
      - ./backups:/backups
    networks:
      - playability-network
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - backup
    entrypoint: ["/bin/sh", "/backup.sh", "full"]

networks:
  playability-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
