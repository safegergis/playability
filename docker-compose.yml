version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: playability-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-playability}
      POSTGRES_USER: ${DB_USER:-playability_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-playability_dev_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/scripts/docker-entrypoint-initdb.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-playability_user} -d ${DB_NAME:-playability}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - playability-network

  # Backend API (Go)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: playability-backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-playability_user}
      DB_PASSWORD: ${DB_PASSWORD:-playability_dev_password}
      DB_NAME: ${DB_NAME:-playability}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production}
      IGDB_ACCESS_TOKEN: ${IGDB_ACCESS_TOKEN}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      PORT: 8080
      ENVIRONMENT: development
      ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - playability-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Frontend (Nuxt 3)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: playability-frontend
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_URL: http://localhost:8080
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET}
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - playability-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  # Database Backup Service (runs on schedule)
  db-backup:
    image: postgres:16-alpine
    container_name: playability-db-backup
    restart: "no"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-playability_user}
      DB_PASSWORD: ${DB_PASSWORD:-playability_dev_password}
      DB_NAME: ${DB_NAME:-playability}
      BACKUP_DIR: /backups
      RETENTION_DAYS: 30
    volumes:
      - ./database/scripts/backup.sh:/backup.sh:ro
      - ./backups:/backups
    networks:
      - playability-network
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - backup
    entrypoint: ["/bin/sh", "/backup.sh", "full"]

  # Database Migration Service
  db-migrate:
    image: postgres:16-alpine
    container_name: playability-db-migrate
    restart: "no"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-playability_user}
      DB_PASSWORD: ${DB_PASSWORD:-playability_dev_password}
      DB_NAME: ${DB_NAME:-playability}
      PGPASSWORD: ${DB_PASSWORD:-playability_dev_password}
    volumes:
      - ./database/migrations:/migrations:ro
      - ./database/scripts/migrate.sh:/migrate.sh:ro
    networks:
      - playability-network
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    entrypoint: ["/bin/sh"]

networks:
  playability-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
