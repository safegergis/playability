server {
    listen 80;
    server_name playablty.com www.playablty.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name playablty.com www.playablty.com;

    ssl_certificate /etc/letsencrypt/live/playablty.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/playablty.com/privkey.pem;

    location / {
        proxy_pass http://localhost`:3000; # Proxy to your Nuxt.js service
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
