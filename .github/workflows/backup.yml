# Automated Database Backup Workflow
# Runs daily backups and uploads to GitHub Artifacts
# For production, consider using S3 or another cloud storage

name: Database Backup

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  backup:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # Only run on main branch

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up environment
        run: |
          mkdir -p backups
          echo "BACKUP_DATE=$(date +%Y%m%d_%H%M%S)" >> $GITHUB_ENV

      - name: Create database backup
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          # Install PostgreSQL client
          sudo apt-get update
          sudo apt-get install -y postgresql-client

          # Run backup script
          chmod +x database/scripts/backup.sh
          ./database/scripts/backup.sh full

      - name: Upload backup to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: database-backup-${{ env.BACKUP_DATE }}
          path: backups/
          retention-days: 30

      - name: Notify on failure
        if: failure()
        run: |
          echo "Backup failed! Please check the logs."
          # Add notification integration here (Slack, Discord, email, etc.)
